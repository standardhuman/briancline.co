name: Site smoke

# Every 3 hours, checks that briancline.co's customer-facing pages work:
# home + contact paths, /marine, the hull-cleaning calculator and quote API,
# the order form, sailing lessons + the schedule.briancline.co booking flow,
# detailing and delivery lead forms, form endpoints, and mail (MX) records.
# Specs: tests/smoke/. Read-only: pages are opened and clicked through, but
# nothing is submitted, booked, paid or emailed. API checks use GET only.
#
# Alerts: a Telegram message on the first failing run and once when it passes
# again (scripts/smoke-telegram.sh; needs the TELEGRAM_BOT_TOKEN and
# TELEGRAM_CHAT_ID repo secrets, and is skipped without them). GitHub also
# emails whoever last changed this schedule on every failed scheduled run.
# Failure messages name the surface and the likely cause; a screenshot of each
# failure is uploaded as an artifact.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to look up the previous run's result for the Telegram alert

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's bundled Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Check the live site (one retry per check)
        id: smoke
        run: npx playwright test -c playwright.smoke.config.js

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-failure
          path: test-results/smoke/
          retention-days: 7

      - name: Telegram alert on first failure or recovery
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OUTCOME: ${{ steps.smoke.outcome == 'success' && 'success' || 'failure' }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/smoke-telegram.sh
