<!-- @dsCard group="Components" name="Hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BC Marine — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:#0a1628; --cyan:#00bcd4; --brass-light:#d4a85c;
      --grad-brass:linear-gradient(135deg,#c2933f,#8a6526);
      --grad-navy:linear-gradient(135deg,#0a1628 0%,#0d2137 55%,#0a1628 100%);
      --shadow-sm:0 1px 3px rgba(10,22,40,.07);
      --font-display:'Space Grotesk',system-ui,sans-serif; --font-sans:'Inter',system-ui,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:#faf8f4; font-family:var(--font-sans); }
    .hero { position:relative; background:var(--grad-navy); color:#fff; padding:76px 0 84px; }
    .hero::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--grad-brass); }
    .inner { max-width:1080px; margin:0 auto; padding:0 24px; }
    .eyebrow { font-family:var(--font-display); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.16em; color:var(--brass-light); margin:0 0 12px; }
    h1 { font-family:var(--font-display); color:#fff; font-size:54px; font-weight:600; line-height:1.03; letter-spacing:-0.02em; margin:0; max-width:15ch; }
    h1 .cyan { color:var(--cyan); }
    .sub { font-family:var(--font-sans); color:rgba(255,255,255,.74); font-size:18px; font-weight:400; max-width:56ch; margin:20px 0 0; }
    .actions { display:flex; gap:14px; flex-wrap:wrap; margin-top:28px; }
    .btn-cta { font-family:var(--font-display); font-weight:600; font-size:14px; padding:13px 22px; border-radius:8px; border:none; background:var(--grad-brass); color:#fff; box-shadow:var(--shadow-sm); cursor:pointer; }
    .cred { font-family:var(--font-display); font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--brass-light); margin:24px 0 0; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="inner">
      <p class="eyebrow">BC Marine</p>
      <h1>Marine services on <span class="cyan">San Francisco Bay</span>.</h1>
      <p class="sub">Hull cleaning, detailing, sailing lessons, and vessel deliveries — one captain you trust, on the water and at the dock.</p>
      <div class="actions"><button class="btn-cta">Get an instant estimate &rarr;</button></div>
      <p class="cred">USCG Licensed Master · US Sailing Cruising Instructor · ~20 years on the Bay</p>
    </div>
  </header>
</body>
</html>
